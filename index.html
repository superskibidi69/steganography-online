<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Steganography Online — Home</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.1/css/bootstrap.min.css">
  <style>
    html,body{height:100%;}
    body{background:#0f1720;color:#e6eef8;font-family:Segoe UI,Roboto,Helvetica,Arial,sans-serif;margin:0}
    #mesh-bg{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;pointer-events:none;opacity:0.567;}
    .hero{min-height:78vh;display:flex;align-items:center;justify-content:center;padding:40px 16px}
    .card{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);padding:48px;border-radius:12px;max-width:980px}
    .card h1{font-size:42px;margin:0}
    .card h1 small{display:block;margin-top:12px;color:#bcd;font-size:16px}
    a.btn-large{display:inline-block;padding:20px 34px;margin:12px;border-radius:8px;font-size:18px}
    footer{margin-top:24px;color:#9fb;text-align:center;padding-bottom:28px}
  </style>
</head>
<body>
<canvas id="mesh-bg"></canvas>
  <div class="hero">
    <div class="card text-center">
      <h1>Steganography Online <small>Hide messages in images or audio — everything stays in your browser</small></h1>
      <p style="margin-top:22px;">
        <a class="btn btn-primary btn-large" href="/image/">Image LSB</a>
        <a class="btn btn-success btn-large" href="/audio/">Audio LSB</a>
      </p>
    </div>
  </div>
  <script>
  // animated mesh background (shared style with other pages)
  const c=document.getElementById('mesh-bg'),ctx=c.getContext('2d');
  function resize(){c.width=innerWidth;c.height=innerHeight;}window.addEventListener('resize',resize);resize();
  let pts=[];for(let i=0;i<80;i++)pts.push({x:Math.random()*c.width,y:Math.random()*c.height,dx:(Math.random()-.5)*1.2,dy:(Math.random()-.5)*1.2});
  function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}function draw(){ctx.clearRect(0,0,c.width,c.height);pts.forEach(p=>{p.x+=p.dx;p.y+=p.dy;if(p.x<0||p.x>c.width)p.dx*=-1;if(p.y<0||p.y>c.height)p.dy*=-1;ctx.fillStyle='white';ctx.beginPath();ctx.arc(p.x,p.y,1.5,0,Math.PI*2);ctx.fill();});for(let i=0;i<pts.length;i++){for(let j=i+1;j<pts.length;j++){let d=dist(pts[i],pts[j]);if(d<120){ctx.strokeStyle=`hsla(${(i*10+Date.now()/20)%360},80%,60%,${1-d/120})`;ctx.beginPath();ctx.moveTo(pts[i].x,pts[i].y);ctx.lineTo(pts[j].x,pts[j].y);ctx.stroke();}}}requestAnimationFrame(draw);}draw();
  </script>
</body>
</html>
